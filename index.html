<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambela Cultural Market</title>
</head>
<body style="margin: 0; padding: 0; font-family: sans-serif; background-color: #fefce8; color: #422006;">

    <!-- Header -->
    <header style="background-color: #b45309; color: white; padding: 15px; text-align: center; border-bottom: 5px solid #15803d;">
        <h1 style="margin: 0; font-size: 1.3rem;">🛒 የጋምቤላ ባህላዊ ገበያ / Gambela Cultural Market</h1>
    </header>

    <!-- ዋናው ክፍል -->
    <div style="max-width: 600px; margin: 15px auto; padding: 10px;">
        
        <!-- ካርድ 1: ትክክለኛ የባህል ቅርጫት ፎቶ -->
        <div style="background-color: white; border: 2px solid #b45309; border-radius: 15px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <img src="https://images.unsplash.com/photo-1606744824163-985d376605aa?auto=format&fit=crop&w=800&q=80" style="width: 100%; height: 220px; object-fit: cover; border-radius: 10px;" alt="Traditional Basket">
            <div style="padding-top: 10px;">
                <span style="background-color: #15803d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem;">የጋምቤላ ባህል</span>
                <h2 style="color: #b45309; margin: 8px 0; font-size: 1.1rem;">የባህል እደ-ጥበብ / Traditional Anuak Basketry</h2>
                <p style="font-size: 1.1rem; font-weight: bold; margin: 5px 0;">3,500 ብር</p>
                <p style="font-size: 0.85rem; color: #555; margin: 5px 0;">ሻጭ: Aboy &nbsp;|&nbsp; 📞 0915 11 22 33</p>
                <button style="background-color: #b45309; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-weight: bold;">መልእክት ላክ / Message</button>
            </div>
        </div>

        <!-- ካርድ 2: ላም -->
        <div style="background-color: white; border: 2px solid #b45309; border-radius: 15px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <img src="https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?auto=format&fit=crop&w=800&q=80" style="width: 100%; height: 220px; object-fit: cover; border-radius: 10px;" alt="Healthy Cow">
            <div style="padding-top: 10px;">
                <span style="background-color: #15803d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem;">የጋምቤላ ምርት</span>
                <h2 style="color: #b45309; margin: 8px 0; font-size: 1.1rem;">ጤናማ ላም / Healthy Cow</h2>
                <p style="font-size: 1.1rem; font-weight: bold; margin: 5px 0;">25,000 ብር</p>
                <p style="font-size: 0.85rem; color: #555; margin: 5px 0;">ሻጭ: Ujulu &nbsp;|&nbsp; 📞 0918 77 88 99</p>
                <button style="background-color: #b45309; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-weight: bold;">መልእክት ላክ / Message</button>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer style="text-align: center; padding: 15px; color: #b45309; font-size: 0.9rem;">
        <p>© 2026 Gambela Market Hub - ባህላችን ኩራታችን!</p>
    </footer>

</body>
</html>
